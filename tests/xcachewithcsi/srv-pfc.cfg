set name = srv-pfc

all.role server

xrd.port 10982

ofs.osslib libXrdPss.so
pss.cachelib libXrdPfc.so

pss.origin localhost:10981
pfc.ram 1g
pfc.blocksize 512k
pfc.prefetch 8
pfc.cschk cache

# The CSI cache test talks xroot only (root://localhost:10982). Do not
# load XrdHttp here: HTTP without xrd.tls is unused and, after the pss/pfc
# stack, xrootd -b has been exiting 1 during HTTP object construction.

continue @CMAKE_CURRENT_BINARY_DIR@/common.cfg
