# XIOFS POSIX HTTP export. Edit export= and start xiofs-server.service.
# xiofs-server --print   # show the generated xrootd config

# Directory served as / on this host (required)
export = /data

port = 1094

# none | krb5 | jwt  (krb5 and jwt require HTTPS)
auth = none

# HTTPS (omit cert/key for plain HTTP)
#tls.cert = /etc/grid-security/hostcert.pem
#tls.key  = /etc/grid-security/hostkey.pem
#tls.ca   = /etc/grid-security/certificates

# auth=krb5: SPNEGO, then setfsuid to the mapped Unix user
#krb5.keytab     = /etc/krb5.keytab
#krb5.principal  = HTTP/<host>@EXAMPLE.ORG

# auth=jwt: SciTokens / WLCG bearer (ofs.authlib libXrdAccSciTokens.so)
#jwt.config = /etc/xrootd/scitokens.cfg

#readonly = no
#h2 = yes
#user = xrootd

# Extra xrootd snippets (optional)
#continue = /etc/xrootd/xiofs-server.d/
